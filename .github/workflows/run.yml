name: הפעלת בוט לעיבוד קול

run-name: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.call_id) || 'auto' }}

on:
  schedule:
    # הרצה אוטומטית כל 5 דקות
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      call_id:
        description: 'מזהה שיחה'
        required: false
        default: ''

concurrency:
  group: yemot-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write # הרשאת כתיבה קפדנית ללוג

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests groq

      - name: Run bot
        env:
          PHONE_SYSTEM_DID: ${{ secrets.PHONE_SYSTEM_DID }}
          YEMOT_PASSWORD: ${{ secrets.YEMOT_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py
