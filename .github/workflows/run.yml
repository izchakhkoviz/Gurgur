name: Run Voice Processing Bot

on:
  workflow_dispatch:  # מאפשר גם הפעלה ידנית
  schedule:
    - cron: '*/5 * * * *'  # מריץ את הבוט אוטומטית כל 5 דקות

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests groq

      - name: Run bot
        env:
          YEMOT_TOKEN: ${{ secrets.YEMOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PHONE_SYSTEM_DID: ${{ secrets.PHONE_SYSTEM_DID }}
        run: python bot.py
